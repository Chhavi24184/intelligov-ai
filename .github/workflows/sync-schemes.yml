name: Sync 1000+ Government Schemes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-schemes.yml"
      - "scripts/sync_myscheme_dataset.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schemes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert and validate upstream catalogue
        run: python scripts/sync_myscheme_dataset.py
      - name: Commit dataset files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Government_Schemes.json backend/data/schemes.json
          git diff --cached --quiet || git commit -m "Add 1000+ deduplicated government schemes"
          git push
